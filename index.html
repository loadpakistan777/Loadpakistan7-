<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Load Pakistan - Book Loading Vehicle With One Click</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2}
.header{background:#0B3D2E;color:white;padding:15px;text-align:center}
.header h1{font-size:24px}
.header p{font-size:13px;opacity:.9}
.hero{background:white;margin:12px;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.hero h2{color:#0B3D2E;font-size:20px;margin-bottom:8px}
.hero p{color:#555;font-size:14px;line-height:1.5}
input,select{width:100%;padding:13px;margin-top:10px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.btn{width:100%;background:#0B3D2E;color:white;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:bold;margin-top:12px}
.card{background:white;margin:12px;border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card b{color:#0B3D2E;font-size:17px}
.card span{color:#0B3D2E;font-weight:bold;font-size:16px}
.footer{text-align:center;padding:15px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>🚛 LOAD PAKISTAN</h1>
<p>Load Pakistan With One Click</p>
</div>

<div class="hero">
<h2>Book Vehicle</h2>
<p>Loader Rickshaw se 40 Ft Container tak - Sab ek click pe.</p>
<input type="text" placeholder="Pickup Location - Jahan se saman uthana hai">
<input type="text" placeholder="Drop Off Location - Jahan saman pohnchana hai">
<select>
<option>Vehicle Select Karo</option>
<option>Truck - Rs. 120 / KM</option>
<option>Mazda - Rs. 92 / KM</option>
<option>Shahzor - Rs. 70 / KM</option>
<option>Pickup - Rs. 83 / KM</option>
</select>
<button class="btn" onclick="alert('Available Vehicles dekh rahe ho - Neeche scroll karo')">Available Vehicles Dekho →</button>
</div>

<div class="card"><div><b>🚛 Truck</b><br><small>40 Ft Container</small></div><span>Rs. 120 / KM</span></div>
<div class="card"><div><b>🚚 Mazda</b><br><small>Open Body</small></div><span>Rs. 92 / KM</span></div>
<div class="card"><div><b>🛻 Pickup</b><br><small>Sheher ke andar</small></div><span>Rs. 83 / KM</span></div>
<div class="card"><div><b>🚜 Shahzor</b><br><small>Chota Saman</small></div><span>Rs. 70 / KM</span></div>

<div class="footer">© 2026 Load Pakistan - Made in Pakistan</div>
</body>
</html>
